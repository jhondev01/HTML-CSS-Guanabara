<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: lightslategrey;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            width: 90vw;
            background-color: lightblue
        }

        section {
            height: 200px;
            width: 200px;
            background-color: brown;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Flexbox centralizado</h1>
        </section>
    </main>
</body>
</html>
