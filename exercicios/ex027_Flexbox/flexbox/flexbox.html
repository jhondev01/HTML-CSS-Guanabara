<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        body , html {
            background-image: linear-gradient(to top, rgb(35, 93, 113), rgb(73, 140, 122));
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            text-shadow: 0px 2px black;
        }

        button {
            box-shadow: 2px 15px 10px rgba(19, 19, 19, 0.453);
            display: block;
            margin: auto;
            font-size: 20px;
            width: 200px;
            height: 50px;
            background-color: rgb(180, 180, 206);
        }

        button:hover {
            background-color: rgb(19, 208, 142);
            color: white;
            cursor: pointer;
        }

        h1 {
            background-color: aliceblue;
            color: rgb(8, 64, 72);
            text-shadow: none;
        }


        h1, h2 {
            text-align: center;
        }


        div.pai {
            display: flex;
        }

        div.pai2 {
            display: flex;
            flex-direction: row-reverse;
        }

        div.pai3{
            position: relative;
            left: 47%;
            
            display: flex;
            flex-direction: column;
        }

        div.pai4 {
            display: flex;
            flex-direction: column-reverse;
            position: relative;
            left: 47%;
        }

        

        div.filhos {
            flex: auto;
            font-size: 70px;
            text-align: center;
            text-shadow: 2px 2px 2px black;
            border: 2px solid rgb(255, 255, 255);
            width: 100px;
            height: 100px;
        }


    </style>
</head>
<body>
    <main> 
        <a href="empacotamento_e_fluxo.html"><button>próximo</button></a>
        <h1>Direções e Eixos</h1>
        
        <h1>flex:auto // &darr;</h1>
        <h2>row &rAarr;</h2>
        <div class="pai">
            <div class="filhos">
                &#x1F60E;
            </div>
            <div class="filhos">
                &#x1F47D;
            </div>
            <div class="filhos">
                &#x1F978;
            </div>
            <div class="filhos">
                &#x1F916;
            </div>
            <div class="filhos">
                &#x1F976;
            </div>
            <div class="filhos">
                &#x1F47E;
            </div>
        </div>
        <br>
        <h2>row-reverse &lAarr;</h2>
        <div class="pai2">
            <div class="filhos">
                &#x1F60E;
            </div>
            <div class="filhos">
                &#x1F47D;
            </div>
            <div class="filhos">
                &#x1F978;
            </div>
            <div class="filhos">
                &#x1F916;
            </div>
            <div class="filhos">
                &#x1F976;
            </div>
            <div class="filhos">
                &#x1F47E;
            </div>
        </div>
        <br>
        <h2>collum &dArr;</h2>
        <div class="pai3">
            <div class="filhos">
                &#x1F60E;
            </div>
            <div class="filhos">
                &#x1F47D;
            </div>
            <div class="filhos">
                &#x1F978;
            </div>
            <div class="filhos">
                &#x1F916;
            </div>
            <div class="filhos">
                &#x1F976;
            </div>
            <div class="filhos">
                &#x1F47E;
            </div>
        </div>
        <br>
        <h2>collum-reverse &uArr;</h2>
        <div class="pai4">
            <div class="filhos">
                &#x1F60E;
            </div>
            <div class="filhos">
                &#x1F47D;
            </div>
            <div class="filhos">
                &#x1F978;
            </div>
            <div class="filhos">
                &#x1F916;
            </div>
            <div class="filhos">
                &#x1F976;
            </div>
            <div class="filhos">
                &#x1F47E;
            </div>
        </div>
    </main>

</body>
</html>
