<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iest">Estado:</label>
           <select name="estado" id="iest">
            <optgroup label="Região Sudeste">
                
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP" selected>São Paulo</option>
                
            </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="proflist">
            <datalist id="proflist">
                <option>Administrador</option>
                <option>Desenvolvedor</option>
                <option>Professor</option>

            </datalist>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
        <p>
            <label for="imens">Mensagem:</label><br>
            <textarea name="msg" id="imens" cols="30" rows="10"></textarea> <!-- LEMBRETE: cols = colunas e rows = linhas-->
        </p>
    </form>
</body>
</html>
