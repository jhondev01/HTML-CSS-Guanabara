<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="inum">Número:</label>
            <input type="range" id="inum" name="num" value="25" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">25</output>
        </p>

        <p>
            <label for="iano">Ano de Nascimento:</label>
            <input type="number" name="ano" id="iano" min="1800" max="2026" oninput="calcIdade()">
        </p>
        
        <p>
            <label for="ididade">Sua idade é:</label>
            <output id="ididade">0</output>
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Apagar">
        </p>

        <script>
            function calcIdade() {
                let atual = new Date().getFullYear(); ididade.innerHTML = Number(atual) - Number(iano.value)
            }
        </script>

    </form>
</body>
</html>
