<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="iname">Nome:</label>
            <input type="text" name="name" id="iname" required maxlength="30" placeholder="Nome Completo" autocomplete="name" >
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" value="7">
        </p>
        <p>
            <label for="imonth">Período Letivo</label>
            <input type="month" name="month" id="imonth" value="2025-10">
        </p>
        <p>
            <label for="idia">Dia da Avaliação</label>
            <input type="date" name="day" id="idia" value="2025-10-08">
        </p>
        <p>
            <label for="itime">Hora de aplicação da prova</label>
            <input type="time" name="time" id="itime" value="23:00" required>
        </p>
        <p>
            <Input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
